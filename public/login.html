<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EcoPaathshala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:34px;height:34px;">🌱</div>
      <div class="logo-text" style="color:var(--ink);">Eco<span>Paathshala</span></div>
    </div>
    <h2 style="font-size:22px;margin-bottom:6px;">Welcome back</h2>
    <p style="font-size:13.5px;color:rgba(16,26,20,0.6);margin:0 0 22px;">Login to continue your eco journey.</p>
    <form id="loginForm">
      <div class="auth-field">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" required>
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="auth-submit" id="submitBtn">Login →</button>
    </form>
    <div class="auth-switch">New here? <a href="/signup.html">Create an account</a></div>
    <div class="auth-note">College mini-project demo — passwords are hashed and stored in a local database.</div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('submitBtn');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Logging in…';
  try{
    await apiPost('/api/login', {
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });
    window.location.href = '/';
  }catch(err){
    errEl.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Login →';
  }
});
</script>
</body>
</html>
