<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Issues — EcoPaathshala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="issues">
<div id="siteHeader"></div>

<div class="page">
  <div class="page-head">
    <div class="tag">Local Issues</div>
    <h1>Not a textbook — your city's reality</h1>
    <p>Well-known environmental challenges from different regions of India, often missed by the syllabus.</p>
  </div>

  <div class="instrument" style="margin-bottom:36px;">
    <select id="citySelect" onchange="renderCityReading()"></select>
    <div class="readout-row"><span class="readout-label">Air (typical AQI range)</span><span class="readout-value rust-col" id="readAqi">—</span></div>
    <div class="readout-row"><span class="readout-label">Water stress</span><span class="readout-value" id="readWater">—</span></div>
    <div class="readout-row"><span class="readout-label">Leading local issue</span><span class="readout-value leaf-col" id="readIssue" style="font-size:14px;">—</span></div>
  </div>

  <div class="issue-grid" id="issueGrid"></div>
</div>

<footer class="site-footer">EcoPaathshala — data is illustrative, not live monitoring.</footer>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/header.js"></script>
<script>
const REGIONS = {
  North:[["delhi","Delhi NCR"],["chandigarh","Chandigarh"],["jaipur","Jaipur, Rajasthan"],["dehradun","Dehradun, Uttarakhand"],["shimla","Shimla, HP"],["srinagar","Srinagar, J&K"]],
  South:[["bengaluru","Bengaluru, Karnataka"],["chennai","Chennai, Tamil Nadu"],["hyderabad","Hyderabad, Telangana"],["visakhapatnam","Visakhapatnam, AP"],["kochi","Kochi, Kerala"],["thiruvananthapuram","Thiruvananthapuram, Kerala"]],
  West:[["mumbai","Mumbai, Maharashtra"],["pune","Pune, Maharashtra"],["ahmedabad","Ahmedabad, Gujarat"],["surat","Surat, Gujarat"],["panaji","Panaji, Goa"]],
  East:[["kolkata","Kolkata, West Bengal"],["patna","Patna, Bihar"],["bhubaneswar","Bhubaneswar, Odisha"],["ranchi","Ranchi, Jharkhand"]],
  Central:[["kanpur","Kanpur, UP"],["lucknow","Lucknow, UP"],["bhopal","Bhopal, MP"],["indore","Indore, MP"],["raipur","Raipur, Chhattisgarh"]],
  Northeast:[["guwahati","Guwahati, Assam"],["imphal","Imphal, Manipur"],["shillong","Shillong, Meghalaya"],["aizawl","Aizawl, Mizoram"],["kohima","Kohima, Nagaland"],["agartala","Agartala, Tripura"],["gangtok","Gangtok, Sikkim"],["itanagar","Itanagar, Arunachal Pradesh"]]
};
const citySelect = document.getElementById('citySelect');
Object.entries(REGIONS).forEach(([region, cities])=>{
  const grp = document.createElement('optgroup'); grp.label = region;
  cities.forEach(([val,label])=>{
    const o = document.createElement('option'); o.value = val; o.textContent = label; grp.appendChild(o);
  });
  citySelect.appendChild(grp);
});

const cityData = {
  delhi:{aqi:"250–420",water:"Severe",issue:"Winter smog, stubble burning"},
  chandigarh:{aqi:"130–220",water:"High",issue:"Groundwater depletion, nearby stubble burning"},
  jaipur:{aqi:"140–210",water:"Severe",issue:"Water scarcity, groundwater depletion"},
  dehradun:{aqi:"80–140",water:"Moderate",issue:"Deforestation, unplanned urban sprawl"},
  shimla:{aqi:"40–90",water:"High",issue:"Seasonal water shortage, waste management"},
  srinagar:{aqi:"60–120",water:"Moderate",issue:"Dal Lake pollution, deforestation"},
  bengaluru:{aqi:"70–130",water:"Severe",issue:"Lake encroachment, groundwater loss"},
  chennai:{aqi:"60–110",water:"Severe",issue:"Water table depletion, wetland loss"},
  hyderabad:{aqi:"100–170",water:"High",issue:"Hussain Sagar pollution, groundwater stress"},
  visakhapatnam:{aqi:"90–150",water:"Moderate",issue:"Industrial pollution, coastal erosion"},
  kochi:{aqi:"50–100",water:"Low",issue:"Backwater pollution, flooding risk"},
  thiruvananthapuram:{aqi:"40–90",water:"Low",issue:"Coastal erosion, solid waste management"},
  mumbai:{aqi:"90–170",water:"Moderate",issue:"Mangrove loss, coastal flooding"},
  pune:{aqi:"80–150",water:"Moderate",issue:"Mula-Mutha river pollution, urban sprawl"},
  ahmedabad:{aqi:"150–230",water:"High",issue:"Sabarmati pollution, urban heat islands"},
  surat:{aqi:"130–200",water:"Moderate",issue:"Textile industry effluents, air quality"},
  panaji:{aqi:"50–100",water:"Low",issue:"Mining runoff, tourism-driven waste"},
  kolkata:{aqi:"140–220",water:"Moderate",issue:"Wetland shrinkage, air pollution"},
  patna:{aqi:"170–260",water:"High",issue:"Ganga pollution, seasonal flooding"},
  bhubaneswar:{aqi:"90–150",water:"Moderate",issue:"Urban heat, wetland loss"},
  ranchi:{aqi:"100–160",water:"Moderate",issue:"Mining runoff, deforestation"},
  kanpur:{aqi:"180–260",water:"High",issue:"Ganga pollution, tannery effluents"},
  lucknow:{aqi:"160–240",water:"High",issue:"Vehicular pollution, groundwater decline"},
  bhopal:{aqi:"110–170",water:"Moderate",issue:"Industrial legacy contamination, lake pollution"},
  indore:{aqi:"100–160",water:"Moderate",issue:"Waste management, air quality"},
  raipur:{aqi:"110–180",water:"Moderate",issue:"Industrial and mining pollution"},
  guwahati:{aqi:"100–170",water:"Moderate",issue:"Flooding, Brahmaputra riverbank erosion"},
  imphal:{aqi:"60–110",water:"Moderate",issue:"Loktak Lake degradation, deforestation"},
  shillong:{aqi:"50–100",water:"Low",issue:"Deforestation, coal-mining runoff"},
  aizawl:{aqi:"40–90",water:"Low",issue:"Deforestation, shifting cultivation impact"},
  kohima:{aqi:"50–100",water:"Low",issue:"Deforestation, solid waste management"},
  agartala:{aqi:"70–120",water:"Moderate",issue:"Deforestation, wetland loss"},
  gangtok:{aqi:"30–70",water:"Low",issue:"Glacial melt, tourism-driven waste"},
  itanagar:{aqi:"40–90",water:"Low",issue:"Deforestation, hydro-project impact"}
};
function renderCityReading(){
  const d = cityData[citySelect.value];
  document.getElementById('readAqi').textContent = d.aqi;
  document.getElementById('readWater').textContent = d.water;
  document.getElementById('readIssue').textContent = d.issue;
}
citySelect.value = 'delhi';
renderCityReading();

const issues = [
  {region:"Kanpur / Varanasi, UP", title:"Ganga and Tannery Pollution", tags:["Water","Industry"],
   text:"Leather tannery effluents and untreated sewage have heavily polluted a long stretch of the Ganga, affecting local water bodies and public health."},
  {region:"Delhi NCR", title:"Winter Smog and Stubble Burning", tags:["Air","Agriculture"],
   text:"Vehicle emissions and construction dust combine with paddy stubble burning in nearby states to push AQI to hazardous levels every Nov-Jan."},
  {region:"Bengaluru", title:"Vanishing Lakes", tags:["Water","Urbanisation"],
   text:"Once called the 'City of Lakes', hundreds of Bengaluru's water bodies have been encroached upon or turned toxic by sewage dumping and construction."},
  {region:"Mumbai", title:"Mangrove Loss and Flooding", tags:["Coastal","Climate"],
   text:"Construction on reclaimed land is shrinking natural mangrove buffers, increasing the city's monsoon flooding risk each year."},
  {region:"Chennai", title:"Water Scarcity", tags:["Water"],
   text:"The 2019 'Day Zero' crisis showed how groundwater over-extraction and wetland loss can push an entire city to the edge of running dry."},
  {region:"Kolkata", title:"Wetlands and Air Quality", tags:["Air","Water"],
   text:"The East Kolkata Wetlands, which naturally treat the city's sewage, are shrinking even as vehicular and industrial pollution keeps rising."}
];
const grid = document.getElementById('issueGrid');
issues.forEach(it=>{
  const el = document.createElement('div');
  el.className = 'card issue-card' + (it.tags.includes('Water') ? ' leaf-edge' : ' turmeric-edge');
  el.innerHTML = `<div class="region">${it.region}</div><h3>${it.title}</h3><p>${it.text}</p><div class="tags">${it.tags.map(t=>`<span class="issue-tag">${t}</span>`).join('')}</div>`;
  grid.appendChild(el);
});
</script>
</body>
</html>
